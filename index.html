<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Annotator</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <div class="toolbar-left">
        <div class="app-brand">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <span class="app-title">Annotator</span>
        </div>
        <button id="open-btn" class="btn btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Open Image
        </button>
        <input type="file" id="file-input" accept="image/*" hidden>
      </div>

      <div class="toolbar-center">
        <div class="mode-group" role="group" aria-label="Annotation mode">
          <button id="mode-point" class="btn-mode active" title="Point mode (P)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="2" x2="12" y2="6" stroke="currentColor" stroke-width="2"/>
              <line x1="12" y1="18" x2="12" y2="22" stroke="currentColor" stroke-width="2"/>
              <line x1="2" y1="12" x2="6" y2="12" stroke="currentColor" stroke-width="2"/>
              <line x1="18" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="2"/>
            </svg>
            Point
            <kbd>P</kbd>
          </button>
          <button id="mode-rect" class="btn-mode" title="Rectangle mode (R)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <rect x="3" y="3" width="18" height="18" rx="1"/>
            </svg>
            Rectangle
            <kbd>R</kbd>
          </button>
        </div>
      </div>

      <div class="toolbar-right">
        <div class="zoom-indicator" id="zoom-indicator">100%</div>
        <button id="fit-btn" class="btn btn-icon" title="Fit to view (F)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
          </svg>
        </button>
        <button id="export-btn" class="btn btn-secondary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Export JSON
        </button>
        <button id="clear-btn" class="btn btn-danger">Clear All</button>
      </div>
    </header>

    <div class="workspace">
      <div class="canvas-container" id="canvas-container">
        <canvas id="canvas"></canvas>
        <div class="hint" id="hint">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <h3>No image loaded</h3>
          <p>Open a PNG, JPG, or any image file</p>
          <p>or drag &amp; drop it here</p>
          <div class="hint-shortcuts">
            <span><kbd>P</kbd> Point</span>
            <span><kbd>R</kbd> Rectangle</span>
            <span><kbd>Scroll</kbd> Zoom</span>
            <span><kbd>Space</kbd>+drag Pan</span>
            <span><kbd>F</kbd> Fit</span>
          </div>
        </div>
      </div>

      <aside class="annotation-panel">
        <div class="panel-header">
          <h2>Annotations</h2>
          <span id="annotation-count" class="count badge">0</span>
        </div>
        <div class="annotation-list" id="annotation-list">
          <p class="empty-state" id="empty-state">No annotations yet</p>
        </div>
      </aside>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
